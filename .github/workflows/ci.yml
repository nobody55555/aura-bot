name: CI

on:
  push:
    branches: [main, feature/live-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only syntax/undefined-name class issues — not import sorting / unused imports
      - name: Ruff (critical only)
        run: ruff check --select E9,F63,F7,F82 --ignore E501 .

      - name: Syntax check (root + live)
        run: |
          python -m py_compile config.py analyzer.py features.py strategy.py elliott.py risk.py main.py
          python -m compileall -q live

      - name: Unit tests
        run: pytest tests/ -q --tb=short

      - name: Black format check (informational)
        continue-on-error: true
        run: black --check --diff . || true
