name: CI

on:
  push:
    branches: [main, feature/live-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check --select E,F,I --ignore E501 .

      - name: Syntax check (root + live)
        run: |
          python -m py_compile config.py analyzer.py features.py strategy.py elliott.py risk.py main.py
          python -m compileall -q live

      - name: Unit tests (paper path, no network required for core tests)
        run: |
          # PaperBroker / OrderManager / Safety tests use local SQLite only
          pytest tests/ -q --tb=short -k "not ccxt" || pytest tests/ -q --tb=short

      - name: Black format check (informational)
        continue-on-error: true
        run: black --check --diff . || true
