name: CI

on:
  push:
    branches: [main, feature/live-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (critical only)
        run: python -m ruff check --select E9,F63,F7,F82 --ignore E501 .

      - name: Syntax check
        run: |
          python -m py_compile config.py analyzer.py features.py strategy.py elliott.py risk.py main.py
          python -m compileall -q live tests

      - name: Smoke imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from live.models import Order; from live.broker.paper import PaperBroker; from live.order_manager import OrderManager; from live.safety import SafetyMonitor; print('imports ok')"

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v --tb=short
